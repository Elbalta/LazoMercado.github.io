<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lazo Mercado | Productos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div>
      <p class="eyebrow">Compra simple, rápida y clara</p>
      <h1>Lazo Mercado · Productos</h1>
    </div>
  </header>

  <main class="layout">
    <section class="panel" aria-labelledby="products-title">
      <div class="panel-header centered">
        <h2 id="products-title">Productos disponibles</h2>
        <p>Conoce nuestra selección directamente desde Lazo Mercado.</p>
      </div>
      <p id="products-status" class="products-status" role="status" aria-live="polite">
        Cargando productos…
      </p>
      <div id="products-list" class="bins-grid" aria-live="polite"></div>
    </section>
  </main>

  <!-- Los flujos de pedidos, pagos y administración quedan fuera de esta etapa. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="script.js"></script>
</body>
</html>
